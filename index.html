<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c4b37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12a10 10 0 0 1 10-10z'/><path d='M12 6v12'/><path d='M8 10c2 2 4 2 8 0'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vivaio Finocchiaro | Catalogo & Listino All'Ingrosso</title>
    <meta name="description" content="Catalogo e listino piante all'ingrosso per rivenditori e garden center. Piante mediterranee, succulente ed esemplari per la vendita professionale." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Rimuove istantaneamente qualsiasi frame o badge "Powered by Netlify" iniettato a runtime
      (function() {
        const removeNetlifyBadge = () => {
          const els = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[id^="nl-"]');
          els.forEach(el => el.remove());
        };
        const observer = new MutationObserver(removeNetlifyBadge);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased min-h-screen selection:bg-moss-200 selection:text-moss-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
