<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Campo dei Fiori | Catalogo & Listino All'Ingrosso</title>
    <meta name="description" content="Campo dei Fiori - Floricoltura e vivaio all'ingrosso a Santa Venerina (CT). Catalogo e listino piante per garden center e rivenditori con disponibilità carrelli CC." />
    <!-- Preload dei Font Critici Locali per Rendering Istantaneo Senza FOUT -->
    <link rel="preload" href="/fonts/cormorant_garamond-normal-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant_garamond-italic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-normal-500.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload dell'immagine Hero critica per visualizzazione immediata (LCP optimization) -->
    <link rel="preload" as="image" href="/brand/hero-cover.webp" type="image/webp" fetchpriority="high" media="(min-width: 769px)" />
    <link rel="preload" as="image" href="/brand/hero-cover-mobile.webp" type="image/webp" fetchpriority="high" media="(max-width: 768px)" />
    <script>
      // Rimuove istantaneamente qualsiasi frame o badge "Powered by Netlify" iniettato a runtime
      (function() {
        const removeNetlifyBadge = () => {
          const els = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[id^="nl-"]');
          els.forEach(el => el.remove());
        };
        const observer = new MutationObserver(removeNetlifyBadge);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
  </head>
  <body class="bg-[#F2F3EB] text-[#282B27] font-sans antialiased min-h-screen selection:bg-[#6BB221]/30 selection:text-[#25570A]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
