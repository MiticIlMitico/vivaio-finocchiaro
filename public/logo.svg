<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Simbolo Floreale / Botanico -->
  <g transform="translate(8, 10)">
    <!-- Cerchio / alone di sfondo -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#064e3b" />
    
    <!-- Petali / Foglie stilizzate -->
    <!-- Petalo sinistro -->
    <path d="M35 35 C20 35 15 22 25 15 C35 8 35 25 35 35 Z" fill="#6ee7b7" opacity="0.9" />
    <!-- Petalo destro -->
    <path d="M35 35 C50 35 55 22 45 15 C35 8 35 25 35 35 Z" fill="#34d399" opacity="0.8" />
    <!-- Foglia centrale eretta -->
    <path d="M35 48 C27 34 29 18 35 12 C41 18 43 34 35 48 Z" fill="#a7f3d0" />
    <!-- Stelo / Germoglio base -->
    <path d="M35 44 C35 53 33 58 35 58" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />
    <!-- Foglia laterale bassa sinistra -->
    <path d="M35 47 C24 47 21 40 27 37 C33 34 34 43 35 47 Z" fill="#34d399" opacity="0.85" />
    <!-- Foglia laterale bassa destra -->
    <path d="M35 47 C46 47 49 40 43 37 C37 34 36 43 35 47 Z" fill="#6ee7b7" opacity="0.75" />
    <!-- Bocciolo centrale luminoso -->
    <circle cx="35" cy="31" r="3.5" fill="#fef08a" />
  </g>

  <!-- Testo Logo: CAMPO DEI FIORI -->
  <text x="94" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#064e3b" letter-spacing="-0.5">
    CAMPO DEI FIORI
  </text>

  <!-- Sottotitolo: FLORICOLTURA & VIVAIO • SANTA VENERINA (CT) -->
  <text x="96" y="64" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#059669" letter-spacing="1.8">
    AZIENDA AGRICOLA • SANTA VENERINA (CT)
  </text>
</svg>
